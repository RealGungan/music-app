services:
  nasmusic:
    image: python:3.12-slim
    container_name: nasmusic
    restart: unless-stopped
    # === HTTP API exposed to LAN. Apps point at http://music.rg.nig:8004 ===
    ports:
      - "8004:6680"
    environment:
      # Your real NAS music locations (also mounted below)
      NASMUSIC_MUSIC_ROOT: /data/music
      NASMUSIC_STAGING_DIR: /data/staging
      NASMUSIC_PLAYLIST_DIR: /data/playlists
      NASMUSIC_FOLDERS: "Heavy,Jazz,OSTs,Saved,Liked"
      NASMUSIC_EXPIRY_DAYS: "7"
      NASMUSIC_PORT: "6680"
      NASMUSIC_APP_DIR: /app
      # AcoustID API key -> enables acoustically fingerprinting NAS files to
      # detect mislabeled songs (S5). Free key from https://acoustid.org/applications
      NASMUSIC_ACOUSTID_API_KEY: t2GAp42WWH
      # (Optional) Spotify API creds -> enables Spotify artist photos + album
      # covers. Create a free app at https://developer.spotify.com/dashboard
      SPOTIFY_CLIENT_ID: PASTE_YOUR_CLIENT_ID_HERE
      SPOTIFY_CLIENT_SECRET: PASTE_YOUR_CLIENT_SECRET_HERE
    # Explicit public DNS so the first-boot apt/pip install can resolve
    # packages even when the host/daemon DNS is unreachable from inside the
    # container (symptom: "Could not resolve 'deb.debian.org'").
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # --- Mount your music folders + the server/ source code ---
    volumes:
      # The NASMusic server source (from this repo's server/ folder).
      # Put the server/ contents somewhere on the NAS, e.g. /srv/.../Apps/NASMusic
      - /srv/dev-disk-by-uuid-a1f085fe-4826-49bd-bce1-aa64dd7178f0/Users/RealGungan/Media/Music/Songs:/data/music
      - /srv/dev-disk-by-uuid-a1f085fe-4826-49bd-bce1-aa64dd7178f0/Users/RealGungan/Media/Music/Staging:/data/staging
      - /srv/dev-disk-by-uuid-a1f085fe-4826-49bd-bce1-aa64dd7178f0/Users/RealGungan/Media/Music/Playlists:/data/playlists
      # >>> Your REAL server source lives here (HDD 1) — no EDIT needed <<<
      - /srv/dev-disk-by-uuid-a1f085fe-4826-49bd-bce1-aa64dd7178f0/Users/RealGungan/App/music-app:/app
    # Run the container startup script (server/run.sh, mounted at /app/run.sh).
    # It installs ffmpeg+pip deps on first boot, then starts the server.
    command: ["bash", "/app/run.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:6680/staging/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # ffmpeg writes to a temp dir; keep it out of the read-only-ish mounts
    tmpfs:
      - /tmp

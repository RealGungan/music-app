[project]
name = "mopidy-staging"
version = "0.1.0"
description = "Discover -> stage -> keep lifecycle for self-hosted music"
requires-python = ">=3.12"
dependencies = ["mopidy>=3.4,<4"]

[project.entry-points."mopidy.ext"]
staging = "mopidy_staging:Extension"

[build-system]
requires = ["setuptools<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mopidy_staging*"]

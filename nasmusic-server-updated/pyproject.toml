[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nasmusic-server"
version = "0.1.0"
description = "NASMusic server: search-anything, stream-instantly, save-if-you-like-it"
requires-python = ">=3.9"
dependencies = [
    "ytmusicapi>=1.0",
    "yt-dlp",
    "mutagen",
]

[project.scripts]
nasmusic = "nasmusic.__main__:main"

[tool.setuptools]
packages = ["nasmusic"]
